name: DevOps CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  compile-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 18 

    - name: Install Backend Dependencies & Run Tests
      run: |
        cd backend
        sudo npm install
        #sudo npm test

    - name: Install Frontend Dependencies & Run Tests
      run: |
        cd client # FIXED: Changed 'frontend' to 'client'
        sudo npm install
        #sudo npm test

    - name: Login to Docker Hub
      uses: docker/login-action@v3 # FIXED: Aligned spaces evenly
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }} # FIXED: Changed 'vars' to 'secrets'
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push Combined Production Image
      uses: docker/build-push-action@v5
      with:
        context: .  
        file: ./Dockerfile
        target: final  # Explicitly telling Docker to build the final combined stage
        push: true
        tags: muthukdnl/todo-app-production:latest